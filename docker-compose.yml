version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqldata:/var/opt/mssql

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  trading-api:
    build:
      context: ./src
      dockerfile: Trading.API/Dockerfile

    container_name: trading-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: >
        Server=sqlserver;
        Database=TradingDb;
        User Id=sa;
        Password=${MSSQL_SA_PASSWORD};
        TrustServerCertificate=True;
        Encrypt=False;

    depends_on:
      sqlserver:
        condition: service_healthy

    restart: unless-stopped

  trading-worker:
    build:
      context: ./src
      dockerfile: Trading.Worker/Dockerfile

    container_name: trading-worker

    environment:
      DOTNET_ENVIRONMENT: Production

      # Groww credentials — real values live in .env (gitignored), never here.
      # Only the Worker needs them: it runs GrowwTokenRefreshWorker. The API reads
      # the resulting token from SystemSettings, so it holds no credential.
      Groww__ApiKey: ${GROWW_API_KEY}
      Groww__TotpSecret: ${GROWW_TOTP_SECRET}

      ConnectionStrings__DefaultConnection: >
        Server=sqlserver;
        Database=TradingDb;
        User Id=sa;
        Password=${MSSQL_SA_PASSWORD};
        TrustServerCertificate=True;
        Encrypt=False;

    depends_on:
      sqlserver:
        condition: service_healthy

    restart: unless-stopped

volumes:
  sqldata: